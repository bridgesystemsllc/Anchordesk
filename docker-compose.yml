services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: anchor-postgres
    environment:
      POSTGRES_USER: anchor
      POSTGRES_PASSWORD: anchor
      POSTGRES_DB: anchor
    ports:
      - '5432:5432'
    volumes:
      - anchor-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U anchor -d anchor']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  anchor-pgdata:
